<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>错题本 · P6 Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E2;
    --paper-line:#D9CFB4;
    --ink:#20293D;
    --ink-soft:#5B6472;
    --red:#B23A2E;
    --green:#2F6B4F;
    --green-soft:#DCEBE2;
    --amber:#9C7A1E;
    --card:#FFFDF6;
    --shadow: 0 1px 0 rgba(32,41,61,0.05), 0 8px 24px -12px rgba(32,41,61,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 37px,
        var(--paper-line) 37px, var(--paper-line) 38px
      );
    background-attachment:local;
    color:var(--ink);
    font-family:"Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }
  .margin-rule{
    position:fixed; top:0; bottom:0; left:28px; width:1px;
    background:rgba(178,58,46,0.28); z-index:0; pointer-events:none;
  }
  @media (min-width:640px){ .margin-rule{ left:calc(50% - 300px); } }

  header{ position:relative; z-index:1; max-width:680px; margin:0 auto; padding:34px 20px 18px 40px; }
  @media (min-width:640px){ header{padding-left:52px;} }
  .eyebrow{ font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:.14em; color:var(--red); text-transform:uppercase; font-weight:700; }
  h1{ font-family:"Noto Serif SC", serif; font-weight:900; font-size:28px; margin:6px 0 4px; letter-spacing:.01em; }
  .subtitle{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin:0 0 18px; }

  .stampbar{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 6px; }
  .stamp{ font-family:"JetBrains Mono", monospace; font-size:12px; font-weight:700; border:1.5px solid var(--ink); border-radius:3px; padding:6px 10px; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:baseline; gap:6px; }
  .stamp .n{font-size:16px;}
  .stamp.correct{border-color:var(--green); color:var(--green);}
  .stamp.wrong{border-color:var(--red); color:var(--red);}
  .stamp.pending{border-color:var(--ink-soft); color:var(--ink-soft);}
  .stamp.rate{border-color:var(--amber); color:var(--amber);}

  .filters{ display:flex; gap:8px; margin:16px 0 4px; flex-wrap:wrap; align-items:center; }
  .filter-btn{ font-family:"Noto Sans SC",sans-serif; font-size:13px; font-weight:500; border:1px solid var(--paper-line); background:var(--card); color:var(--ink-soft); border-radius:20px; padding:7px 14px; cursor:pointer; transition:all .15s; }
  .filter-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .reset-btn{ margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:7px 4px; }

  main{ position:relative; z-index:1; max-width:680px; margin:0 auto; padding:8px 20px 40px 40px; }
  @media (min-width:640px){ main{padding-left:52px;} }

  .qcard{ background:var(--card); border:1px solid var(--paper-line); border-radius:6px; margin:18px 0; box-shadow:var(--shadow); overflow:hidden; position:relative; }
  .qhead{ display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px dashed var(--paper-line); }
  .qnum{ font-family:"JetBrains Mono",monospace; font-weight:700; font-size:13px; background:var(--ink); color:var(--paper); border-radius:3px; padding:3px 9px; letter-spacing:.02em; }
  .qsource{ font-size:11.5px; color:var(--ink-soft); font-family:"JetBrains Mono",monospace; }
  .status-badge{ margin-left:auto; font-size:11px; font-family:"JetBrains Mono",monospace; font-weight:700; padding:3px 9px; border-radius:20px; opacity:0; transform:scale(.85) rotate(-6deg); transition:opacity .25s, transform .25s; }
  .status-badge.show{ opacity:1; transform:scale(1) rotate(-6deg); }
  .status-badge.correct{ background:var(--green-soft); color:var(--green); border:1px solid var(--green);}
  .status-badge.wrong{ background:#F6E1DC; color:var(--red); border:1px solid var(--red);}

  .qstem{ padding:14px 16px 6px; font-size:15px; line-height:1.7; }
  .qstem p{ white-space:pre-wrap; margin:0 0 10px; }
  .qstem img{ display:block; max-width:100%; height:auto; margin:6px 0 14px; border:1px solid var(--paper-line); border-radius:4px; background:#fff; }
  .qstem table{ border-collapse:collapse; margin:8px 0 14px; font-size:13.5px; width:100%; max-width:420px; }
  .qstem table th, .qstem table td{ border:1px solid var(--ink); padding:5px 10px; text-align:center; }
  .qstem table th{ background:#EFE9D8; font-weight:700; }

  .options{ padding:6px 16px 14px; display:flex; flex-direction:column; gap:9px; }
  .opt{ position:relative; text-align:left; width:100%; border:1.5px solid var(--paper-line); background:#FFFFFF; border-radius:5px; padding:10px 42px 10px 14px; font-size:14.5px; line-height:1.55; cursor:pointer; color:var(--ink); font-family:"Noto Sans SC",sans-serif; transition:border-color .15s, background .15s; }
  .opt:hover{ border-color:var(--ink-soft); }
  .opt.picked{ border-color:var(--ink); background:#FBF8EF; }
  .opt .tag{ font-family:"JetBrains Mono",monospace; font-weight:700; margin-right:8px; color:var(--ink-soft); }
  .opt .mark{ position:absolute; right:10px; top:50%; transform:translateY(-50%) scale(0); font-size:20px; font-weight:900; transition:transform .25s cubic-bezier(.34,1.6,.64,1); font-family:"JetBrains Mono",monospace; }
  .opt.reveal-correct{ border-color:var(--green); background:var(--green-soft); }
  .opt.reveal-correct .mark{ transform:translateY(-50%) scale(1); color:var(--green); }
  .opt.reveal-wrong{ border-color:var(--red); background:#F8E9E5; }
  .opt.reveal-wrong .mark{ transform:translateY(-50%) scale(1); color:var(--red); }
  .opt[disabled]{ cursor:default; }

  .circle-wrap{ position:absolute; inset:-6px; pointer-events:none; }
  .circle-wrap svg{ width:100%; height:100%; overflow:visible; }
  .circle-wrap path{ fill:none; stroke:var(--red); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:340; stroke-dashoffset:340; }
  .opt.reveal-correct .circle-wrap path{ animation:draw .6s ease forwards .05s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .actions{ padding:2px 16px 16px; display:flex; gap:10px; }
  .btn{ font-family:"Noto Sans SC",sans-serif; font-weight:700; font-size:13.5px; border-radius:5px; padding:10px 16px; cursor:pointer; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); transition:opacity .15s; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--ink); }

  .explain{ max-height:0; overflow:hidden; transition:max-height .35s ease; background:#FBF7EC; border-top:1px dashed var(--paper-line); }
  .explain.open{ max-height:1200px; }
  .explain-inner{ padding:14px 16px 16px; }
  .explain-label{ font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:.1em; margin-bottom:6px; display:flex; gap:6px; align-items:center; }
  .explain-label .pin{ width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; }
  .explain-text{ font-size:14px; line-height:1.85; color:var(--ink); white-space:pre-wrap; }
  .flag{ margin-top:10px; font-size:12.5px; color:var(--amber); background:#FBF1DC; border:1px solid #E4CE8E; border-radius:4px; padding:8px 10px; line-height:1.6; }

  footer{ max-width:680px; margin:0 auto; padding:20px 20px 40px 40px; color:var(--ink-soft); font-size:12px; line-height:1.7; position:relative; z-index:1; }
  @media (min-width:640px){ footer{padding-left:52px;} }
  footer code{ font-family:"JetBrains Mono",monospace; background:var(--card); padding:1px 5px; border-radius:3px;}

  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>
<div class="margin-rule"></div>

<header>
  <div class="eyebrow">错题本 · 已批改 · REVIEW SET</div>
  <h1>P6 Science 错题练习</h1>
  <p class="subtitle">把每一次做错的题目重新整理，随时点开自测、对答案、看讲解。题目原文保留英文，讲解用中文说明。答题记录会自动保存在这台设备上，下次打开可以接着练。</p>

  <div class="stampbar" id="stampbar"></div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="unanswered">未作答</button>
    <button class="filter-btn" data-filter="wrong">再练一次（答错的）</button>
    <button class="filter-btn" data-filter="correct">已掌握</button>
    <button class="reset-btn" id="resetBtn">清空记录</button>
  </div>
</header>

<main id="main"></main>

<footer>
  批次 1 · 2026-07-20 整理 · 共 <span id="totalCount"></span> 题，来自 P6 SC Prelim 2025 MCQ 合集 与 生物错题练习集。题目文字保留原文英文，图表为原卷截图（已去除批改笔迹）。<br>
  以后每次上传新的错题，会作为新的批次追加进来，题号不会和已有的重复。
</footer>

<script>

       {type:"text", value:"..."}         纯文字段落（原文英文）
       {type:"image", key:"...", alt:"..."}  引用 IMAGES 里的图
       {type:"table", headers:[...], rows:[[...]]}  数据表格

const BATCHES = [{"id": "batch1", "label": "Batch 1", "date": "2026-07-20", "questions": [{"id": "b1-01", "num": "Q4", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "Study the diagram."}, {"type": "image", "key": "q4", "alt": "Diagram showing digestion, respiratory and circulatory systems"}, {"type": "text", "value": "Which statement is correct?"}], "options": ["Gas M is carbon dioxide.", "System X breaks down food into mineral salts.", "In system Z, carbon dioxide is converted to oxygen.", "System Y removes carbon dioxide and waste from the body."], "correct": 3, "explain": "System X 是消化系统，把食物分解成更简单的养分分子（simpler nutrient substances），而不是「矿物盐」——矿物盐本身已经是简单物质，不需要被「分解」出来，所以 (2) 错。气体 M 经 System Z（呼吸系统）从空气中被吸入，应该是氧气，不是二氧化碳，所以 (1) 错。呼吸系统的作用是气体交换，不会把 CO2「转化」成 O2，所以 (3) 错。System Y 是循环系统，负责把包括 CO2 在内的代谢废物运送到能排出体外的器官，所以 (4) 正确。"}, {"id": "b1-02", "num": "Q7", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The table shows the parts present in cells P, Q and R."}, {"type": "table", "headers": ["", "P", "Q", "R"], "rows": [["nucleus", "✓", "✓", "✓"], ["chloroplast", "✗", "✗", "✓"], ["cell wall", "✓", "✗", "✓"], ["cell membrane", "✓", "✓", "✓"]]}, {"type": "text", "value": "Key: ✓ present, ✗ absent\n\nWhich statement is correct?"}], "options": ["Q and R are from a plant.", "P and R are from a plant.", "P and Q are from an animal.", "P, Q and R are from a plant."], "correct": 1, "explain": "判断植物细胞最可靠的依据是「细胞壁」，而不是叶绿体——比如根细胞就没有叶绿体，但仍然是植物细胞。P 有细胞壁 → 植物细胞；Q 没有细胞壁 → 动物细胞；R 同时有细胞壁和叶绿体 → 一定是植物细胞。所以 P 和 R 都是植物细胞，答案是 (2)。"}, {"id": "b1-03", "num": "Q8", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "A gardener puts some dead leaves around a plant as shown."}, {"type": "image", "key": "q8", "alt": "A tree with dead leaves around its base"}, {"type": "text", "value": "How can the dead leaves benefit the tree?\nA  make food for the tree\nB  prevent animals from seeking shelter on the tree\nC  enrich the soil to provide the tree with mineral salts\nD  reduce the amount of water that evaporates from the soil"}], "options": ["C only", "A and B only", "C and D only", "B, C and D only"], "correct": 2, "explain": "枯叶被分解者分解后，会把矿物盐释放回土壤，使土壤更肥沃（C）；同时枯叶像「覆盖层」一样盖在土壤表面，能减少土壤水分的蒸发（D）。制造食物是光合作用的功能，不是枯叶的作用，所以 A 不对；B（阻止动物躲藏）也不是对树木本身的好处，是干扰选项。正确答案：(3) C and D only。"}, {"id": "b1-04", "num": "Q13", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The diagram shows the experimental set-up Joe used to investigate the effect of a plant on the amount of carbon dioxide in the surrounding air."}, {"type": "image", "key": "q13", "alt": "Experimental set-up with flask X, a plant in a plastic bag, and flask Y, connected by tubing with air flowing in and out"}, {"type": "text", "value": "Limewater becomes cloudy when it mixes with carbon dioxide.\nWhat happens to the limewater in flask X and in flask Y in the above set-up?"}], "options": ["X: becomes cloudy  /  Y: becomes cloudy", "X: becomes cloudy  /  Y: remains clear", "X: remains clear  /  Y: becomes cloudy", "X: remains clear  /  Y: remains clear"], "correct": 2, "explain": "石灰水遇到 CO2 会变浑浊，浑浊程度反映的是空气里 CO2 的多少。植物同时进行呼吸作用（放出 CO2）和光合作用（吸收 CO2），净效应要看光照够不够强、以及气流经过植物前后的对比。根据这份试卷的批改，正确答案是 (3)。", "flag": "⚠️ 这题的气流先后顺序（X 在前、Y 在后）比较容易搞混，如果对判断逻辑还有疑问，建议再和老师确认一次这份试卷的讲解，确保完全理解「谁先接触植物、谁后接触植物」。"}, {"id": "b1-05", "num": "Q14", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "Organism Q lives at the gills of the fish and can only be seen under a microscope."}, {"type": "image", "key": "q14", "alt": "Diagram of a fish head showing the gills"}, {"type": "text", "value": "Organism Q causes the fish to develop larger gills. Such fish are often found near the surface of the water.\nBased on the information above, which of the following best explains why organism Q caused the fish to develop larger gills?"}], "options": ["The fish produces more carbon dioxide to be removed at the gills.", "The fish has a reduced rate of gaseous exchange with the air above water.", "The fish has more blood vessels at the gills to transport more digested food to Q.", "The fish has more blood vessels at the gills to absorb more water rich in oxygen."], "correct": 3, "explain": "鱼靠近水面生活，是因为水面附近的水与空气接触更多，溶氧量更高。鳃变大意味着有更多血管、更大的表面积，能吸收更多水中的氧气——这正好解释了为什么这种鱼会往含氧量更高的水面附近游。选项 (3) 提到的是运送「消化后的食物」给寄生虫，跟鳃部发育变大没有关系，是干扰选项。正确答案：(4)。"}, {"id": "b1-06", "num": "Q15", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The diagram below shows a circuit containing three rods, X, Y or Z. There are two metal rods and a plastic rod."}, {"type": "image", "key": "q15", "alt": "Circuit diagram with a bulb, battery, and three rods X, Y and Z"}, {"type": "text", "value": "Which of the following identifies the material of the rods correctly to light up the bulb in the circuit? (Rod X / Rod Y / Rod Z)"}], "options": ["metal / metal / plastic", "plastic / metal / metal", "metal / plastic / metal", "plastic / metal / plastic"], "correct": 2, "explain": "要点亮灯泡，电流必须有完整的导电路径。棒 X 处在电路中唯一必经的位置（相当于串联），所以 X 一定要是金属。棒 Y 和棒 Z 则分别在两条可供选择的路径上（相当于并联），只要其中一条能导电，电流就能通过，另一条即使是塑料也没关系。由于三根棒中只有两根是金属，X 已经用掉一根，Y、Z 里只要有一根是金属就够了——这份试卷的标准答案是 X 金属、Y 塑料、Z 金属，也就是选项 (3)。"}, {"id": "b1-07", "num": "Q19", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The diagram shows a toilet bowl. Water fills the water tank to a fixed level after each flush. A bottle of marbles is placed in the water tank to help conserve water."}, {"type": "image", "key": "q19", "alt": "Diagram of a toilet bowl with a bottle of marbles inside the water tank"}, {"type": "text", "value": "Less water is needed to flush the toilet when the bottle is in the water tank because ___.\nA  water does not have a fixed shape.\nB  the bottle of marbles has a fixed shape.\nC  the bottle of marbles occupies space in the water tank."}], "options": ["A only", "C only", "A and B only", "A, B and C"], "correct": 1, "explain": "瓶子占据了水箱里的一部分空间（C），水箱要「装满」到固定水位时，实际能装的水自然就变少了，所以每次冲水用的水量也变少。A（水没有固定形状）和 B（瓶子有固定形状）虽然都是事实，但都不是「为什么能省水」的直接原因，是干扰选项。正确答案：(2) C only。"}, {"id": "b1-08", "num": "Q20", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "John placed two magnets, P and Q, close together as shown."}, {"type": "image", "key": "q20", "alt": "Two bar magnets P and Q on a track, with like poles facing each other"}, {"type": "text", "value": "What was the direction of the magnetic force acting on P and the direction of friction acting on Q when John released Q? (Magnetic force on P / Friction on Q; → means right, ← means left)"}], "options": ["→ / →", "→ / ←", "← / →", "← / ←"], "correct": 3, "explain": "P 的 N 极和 Q 的 N 极正对着——同名磁极相斥。松手后 Q 被推向右边（远离 P）。根据牛顿第三定律，Q 对 P 的反作用力方向相反，所以 P 受到的磁力方向是向左（←）。同时，Q 往右滑动时，摩擦力总是阻碍物体的运动方向，所以摩擦力方向是向左（←），和 Q 的运动方向相反。两个方向都是 ←，正确答案：(4)。"}, {"id": "b1-09", "num": "Q21", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The set-up below shows how clean water can be collected from sea water."}, {"type": "image", "key": "q21", "alt": "Set-up showing boiling sea water, a sloped plate, and clean water being collected"}, {"type": "text", "value": "Which of the following would increase the amount of clean water collected within a short period of time?"}], "options": ["Using a cool glass plate", "Using a cool metal plate", "Using a warm glass plate", "Using a warm metal plate"], "correct": 1, "explain": "水蒸气要变回液态水（凝结），需要尽快失去热量。金属是热的良导体，能更快把水蒸气的热量传导走，让水蒸气更快冷凝；同时，plate 一开始的温度越低，跟热蒸汽的温差越大，散热也越快。两个条件加在一起，「冷的金属板」（cool metal plate）能在最短时间内收集到最多的洁净水，正确答案：(2)。"}, {"id": "b1-10", "num": "Q22", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The diagram shows an archer aiming at the target. To shoot an arrow, he needs to pull the bow string back before releasing it."}, {"type": "image", "key": "q22", "alt": "An archer aiming a bow and arrow at a target"}, {"type": "text", "value": "Which of the following best represents the energy conversions involved in shooting an arrow from the point of release?"}], "options": ["kinetic energy (string) → kinetic energy (arrow) → sound energy (arrow)", "kinetic energy (archer) → kinetic energy (string) → potential energy (arrow)", "potential energy (string) → kinetic energy (string) → kinetic energy (arrow)", "potential energy (archer) → potential energy (string) → kinetic energy (arrow)"], "correct": 2, "explain": "题目问的是「从松手的那一刻开始」（from the point of release）的能量转换，所以拉弓时弓箭手输入的力气（archer 的能量）已经不在讨论范围内了。松手前，被拉伸的弓弦已经储存着弹性势能（potential energy of the string）；松手后，弦的势能先转化为弦本身的动能（kinetic energy of string），弦再把这份动能传给箭，箭获得动能飞出去。正确顺序：potential energy (string) → kinetic energy (string) → kinetic energy (arrow)，答案 (3)。"}, {"id": "b1-11", "num": "Q23 (light sensor)", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "Junwei set up the following experiment in a dark room. The light sensor on the screen gave a reading of 30 units."}, {"type": "image", "key": "q23a", "alt": "Set-up with a lamp, a book, and a light sensor on a screen"}, {"type": "text", "value": "As Junwei moved one object in the set-up, the reading on the light sensor increased slowly to 40 units and then dropped to 0 units suddenly.\nWhich object did Junwei move and in which direction?"}], "options": ["Move the book towards the lamp.", "Move the lamp towards the screen.", "Move the screen towards the book.", "Move the lamp away from the book."], "correct": 1, "explain": "灯往屏幕方向移动（同时靠近书本和屏幕），会让光线更集中、更亮，同时 book 投下的影子也会跟着变大。影子逐渐变大，意味着传感器接收到的光一开始还在慢慢增加（还没被完全遮住），直到影子最终完全盖住传感器，读数才会「突然」降到 0。这和题目描述的「先慢慢升高、再突然掉到 0」完全吻合，正确答案：(2)。"}, {"id": "b1-12", "num": "Q23 (magnetic rings)", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "The diagram below shows three rings X, Y and Z arranged on a pole. One of the rings is copper and the other two rings are magnets."}, {"type": "image", "key": "q23b", "alt": "Three rings X, Y and Z arranged on a pole; X and Y are touching, Y and Z have a gap"}, {"type": "text", "value": "Based on the information, which of the following statement(s) is/are correct?\nA  X and Y are attracted to each other.\nB  X is made of non-magnetic material.\nC  Like poles of Y and Z are facing each other."}], "options": ["B only", "C only", "A and B only", "B and C only"], "correct": 3, "explain": "Y 和 Z 之间悬空、没有接触，说明它们之间存在排斥力，也就是同名磁极相对（C 正确）。X 和 Y 之间没有空隙、紧贴在一起，说明它们之间并没有互相排斥的磁力；如果 X 是不具磁性的铜环，它自然不会跟磁铁 Y 产生吸力或斥力，两者只是靠着——这说明 X 是非磁性材料（B 正确），而不是「X 和 Y 互相吸引」（A 是干扰选项）。正确答案：(4) B and C only。"}, {"id": "b1-13", "num": "Q23 (bars AB/CD/EF)", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "Chin Keong wanted to find out which of three metal bars, AB, CD and EF, are magnets. He hung each bar from a string and brought them near to each other. His results are as shown."}, {"type": "image", "key": "q23c", "alt": "Four pairs of suspended bars being brought near each other: AB-CD, BA-CD, AB-EF, AB-FE"}, {"type": "text", "value": "Which of the following is correct? (AB / CD / EF)"}], "options": ["not a magnet / magnet / magnet", "not a magnet / not a magnet / magnet", "magnet / not a magnet / magnet", "magnet / magnet / magnet"], "correct": 2, "explain": "判断是否为磁铁的关键方法：把同一根棒调转方向后再靠近另一根棒——真正的磁铁两端极性不同，调转方向后「吸引」会变成「排斥」（或反过来）；如果调转方向后结果完全没变，说明其中至少有一根根本不是磁铁（只是被磁铁吸住的金属）。根据 Chin Keong 的悬挂测试结果，AB 和 EF 表现出磁铁应有的特征（调转方向后反应会改变），判断为磁铁；CD 两次测试结果一致，判断为不是磁铁。正确答案：(3)。"}, {"id": "b1-14", "num": "Q24", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "A string was passed through a straw. A balloon was then taped to the straw as shown below."}, {"type": "image", "key": "q24", "alt": "A balloon taped to a straw threaded on a string between two walls"}, {"type": "text", "value": "When the rubber band was removed, the balloon and the straw moved together in the direction shown in the diagram.\nWhich of the following correctly explains this observation?"}], "options": ["There was no frictional force between the balloon and the air.", "There was no frictional force between the string and the straw.", "The force of the air rushing out of the balloon was greater than the gravitational force acting on the balloon.", "The force of the air rushing out of the balloon was greater than the frictional force between the straw and string."], "correct": 3, "explain": "气球喷出空气时会产生一个反作用力，推动气球和吸管沿着线移动（原理类似火箭喷气推进）。吸管要能沿着线滑动，这股推力就必须大于吸管与线之间的摩擦力——所以正确的比较对象是「喷气的力」与「摩擦力」，而不是「重力」（这里的运动是沿着水平的线移动，跟重力没有直接关系，(3) 是干扰选项）。正确答案：(4)。"}, {"id": "b1-15", "num": "Q25", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "A boy released a ball from his hands and kicked the ball up into the air as shown in the diagram below."}, {"type": "image", "key": "q25_traj", "alt": "Trajectory of a ball from point A (released) through B (kicked), C (highest point), to D (bounces)"}, {"type": "text", "value": "Which of the following shows the amount of gravitational force acting on the ball as the ball moves from points A to D?"}, {"type": "image", "key": "q25_graphs", "alt": "Four graphs of gravitational force against time: (1) zigzag, (2) decreasing, (3) increasing, (4) constant"}], "options": ["Graph (1): force rises, dips, rises again, then falls", "Graph (2): a steadily decreasing line", "Graph (3): a steadily increasing line", "Graph (4): a constant horizontal line"], "correct": 3, "explain": "在地球表面附近，重力的大小基本上是恒定的，不会因为球的高度、速度或运动方向的改变而变化（这点高度变化完全可以忽略）。所以无论球在上升、处于最高点还是在下落，它受到的重力都保持不变——图像应该是一条水平线，正确答案：(4)。"}, {"id": "b1-16", "num": "Q26", "source": "P6 SC Prelim 2025", "stem": [{"type": "text", "value": "An experiment was conducted using springs A and B. Different loads were hung on each spring one at a time. The lengths of the springs were recorded in the graph below."}, {"type": "image", "key": "q26", "alt": "Graph of spring length against load for springs A and B; A starts shorter but has a steeper slope, B starts longer with a gentler slope"}, {"type": "text", "value": "Which of the following are correct conclusions that could be drawn from the experiment? (Longer spring at the start of the experiment / Stiffer spring)"}], "options": ["A / A", "B / B", "A / B", "B / A"], "correct": 1, "explain": "从图中 0g 时的长度（y 轴截距）看，弹簧 B 一开始就比 A 长，所以「一开始更长的弹簧」是 B。判断「更硬（stiffer）」要看同样增加重量时，哪根弹簧伸长得更少：弹簧 A 的线更陡，说明同样增加的重量下 A 伸长得更多，比较容易被拉伸，也就是比较「软」；弹簧 B 的线比较平缓，伸长得较少，说明 B 更「硬」、更难拉伸。所以更硬的弹簧也是 B。正确答案：(2) B / B。"}, {"id": "b1-17", "num": "Q1", "source": "Biology practice set, 2026-05-02", "stem": [{"type": "text", "value": "A glass beaker containing boiling water was left on a table.\nWhich of the following action(s) would cool the boiling water in the shortest time?\nA  Put a metal spoon in the water.\nB  Cover the top of the beaker with a wooden lid.\nC  Wrap the beaker with a cloth that was wet with tap water."}], "options": ["A only", "B only", "A and C only", "B and C only"], "correct": 2, "explain": "金属汤匙是热的良导体，插入水中能帮助热量更快传导到匙柄，再散发到周围空气里，加快降温（A）。湿布包裹烧杯时，布上的水分蒸发会带走大量热量（原理和皮肤出汗降温类似），是很有效的快速降温方法（C）。木盖是热的不良导体（隔热材料），反而会把热量「锁」在烧杯里，减慢散热，所以 B 不对。正确答案：(3) A and C only。"}, {"id": "b1-18", "num": "Q2", "source": "Biology practice set, 2026-05-02", "stem": [{"type": "text", "value": "Justin walked in a straight line from P to R as shown in Figure 1 below. At Q, he was directly under the lamp. The distance between P and Q is the same as the distance between Q and R."}, {"type": "image", "key": "doc2_q2", "alt": "Figure 1: Justin walking from P to R under a lamp at Q; Figure 2: graph of shadow length against time"}, {"type": "text", "value": "Figure 2 shows how the length of Justin's shadow on the ground changed during his walk.\nBased on the graph in Figure 2, which one of the following statements about Justin's walk is NOT correct?"}], "options": ["He took two times longer to walk from Q to R than from P to Q.", "He walked at a slower speed between P and Q than between Q and R.", "When he was directly under the lamp, the length of his shadow was zero.", "As he walked away from the lamp from Q to R, his shadow became longer."], "correct": 1, "explain": "从图 2 看，P 到 Q 这一段影子下降得比较陡（用时较短），Q 到 R 这一段上升得比较缓（用时较长）——同样的距离，Q 到 R 花的时间更长，说明 Justin 在 Q 到 R 之间走得更慢。反过来说，他在 P 到 Q 之间其实走得比较快。所以选项 (2)「他在 P、Q 之间走得比 Q、R 之间慢」的说法是错误的——这正是题目要找的「不正确」的说法，答案是 (2)。其余 (1)(3)(4) 都符合图像。"}, {"id": "b1-19", "num": "Q3", "source": "Biology practice set, 2026-05-02", "stem": [{"type": "text", "value": "Mei Ling set up an experiment using a heat lamp, a piece of cardboard, a thermometer and a glass box with one side open. She covered the open side of the glass box with the cardboard."}, {"type": "image", "key": "doc2_q3", "alt": "Set-up with a heat lamp, cardboard, thermometer and glass box"}, {"type": "text", "value": "When x = 5 cm, Mei Ling recorded the temperature every 10 min after the lamp was switched on. She then repeated her experiment with x = 10, 15, 20 and 25 cm each time.\nMei Ling wanted to investigate how the temperature recorded is affected by ___."}], "options": ["the thickness of the cardboard", "the amount of heat produced by the lamp", "the distance x between the lamp and the cardboard", "the time taken for the heat to pass through the cardboard"], "correct": 2, "explain": "这是一个「控制变量」实验：Mei Ling 每次只改变一个条件——热灯与纸板之间的距离 x，其他条件（纸板厚度、灯的功率等）都保持不变。所以她想研究的正是「距离 x」对温度的影响，正确答案：(3)。"}, {"id": "b1-20", "num": "Q4", "source": "Biology practice set, 2026-05-02", "stem": [{"type": "text", "value": "The diagram shows a plant cell."}, {"type": "image", "key": "doc2_q4", "alt": "A plant cell diagram with parts labelled P, Q, R and S"}, {"type": "text", "value": "Which two parts are also found in animal cells?"}], "options": ["P and Q", "P and S", "Q and R", "R and S"], "correct": 2, "explain": "细胞壁（P）和大型液泡（S）是植物细胞特有的结构，动物细胞没有。细胞膜（Q）和细胞核（R）则是动植物细胞都具备的基本结构。正确答案：(3) Q and R。"}, {"id": "b1-21", "num": "Q5", "source": "Biology practice set, 2026-05-02", "stem": [{"type": "text", "value": "Which one of the following is correct? (Organ involved in digestion of food / Organ involved in absorption of food)"}], "options": ["mouth / large intestine", "stomach / large intestine", "small intestine / small intestine", "large intestine / small intestine"], "correct": 2, "explain": "食物的化学消化在口腔、胃和小肠都会发生，但主要在小肠里完成；消化后的养分（营养物质）也主要是在小肠（通过肠壁上的绒毛）被吸收进入血液。所以同一个器官——小肠，既参与消化，也负责吸收，正确答案：(3)。"}]}];

/* ---------------- 逻辑部分 ---------------- */
const STORE_KEY = "p6sc_wrongbook_progress_v2";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }

let progress = loadProgress();
let currentFilter = "all";

const ALL_QUESTIONS = BATCHES.flatMap(b => b.questions.map(q => ({...q, batchLabel:b.label})));

function computeStats(){
  let correct=0, wrong=0, answered=0;
  ALL_QUESTIONS.forEach(q=>{
    const p = progress[q.id];
    if(p && p.checked){
      answered++;
      if(p.picked === q.correct) correct++; else wrong++;
    }
  });
  return { total: ALL_QUESTIONS.length, correct, wrong, answered, pending: ALL_QUESTIONS.length - answered };
}

function renderStamps(){
  const s = computeStats();
  const rate = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
  document.getElementById("stampbar").innerHTML = `
    <div class="stamp correct">已掌握 <span class="n">${s.correct}</span></div>
    <div class="stamp wrong">再练一次 <span class="n">${s.wrong}</span></div>
    <div class="stamp pending">未作答 <span class="n">${s.pending}</span></div>
    <div class="stamp rate">正确率 <span class="n">${rate}%</span></div>
  `;
  document.getElementById("totalCount").textContent = s.total;
}

function optionLetter(i){ return "①②③④⑤"[i] || (i+1); }

function questionMatchesFilter(q){
  const p = progress[q.id];
  if(currentFilter === "all") return true;
  if(currentFilter === "unanswered") return !(p && p.checked);
  if(currentFilter === "wrong") return p && p.checked && p.picked !== q.correct;
  if(currentFilter === "correct") return p && p.checked && p.picked === q.correct;
  return true;
}

function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderStemBlock(block){
  if(block.type === "text"){
    return `<p>${escapeHtml(block.value)}</p>`;
  }
  if(block.type === "image"){
    const src = IMAGES[block.key] || "";
    return `<img src="${src}" alt="${escapeHtml(block.alt||"")}" loading="lazy">`;
  }
  if(block.type === "table"){
    const head = `<tr>${block.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr>`;
    const rows = block.rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("");
    return `<table>${head}${rows}</table>`;
  }
  return "";
}

function renderMain(){
  const main = document.getElementById("main");
  const list = ALL_QUESTIONS.filter(questionMatchesFilter);
  if(list.length === 0){
    main.innerHTML = `<div class="empty">这个分类下暂时没有题目 ～ 换个筛选试试？</div>`;
    return;
  }
  main.innerHTML = list.map(q => renderCard(q)).join("");
  list.forEach(q => wireCard(q));
}

function renderCard(q){
  const p = progress[q.id] || {};
  const checked = !!p.checked;
  const picked = (typeof p.picked === "number") ? p.picked : null;
  const isCorrect = checked && picked === q.correct;

  const stemHtml = q.stem.map(renderStemBlock).join("");

  const optsHtml = q.options.map((opt, i) => {
    let cls = "opt";
    if(picked === i) cls += " picked";
    let mark = "";
    let circle = "";
    if(checked){
      if(i === q.correct){
        cls += " reveal-correct";
        mark = `<span class="mark">✓</span>`;
        circle = `<span class="circle-wrap"><svg viewBox="0 0 100 40" preserveAspectRatio="none">
          <path d="M8,20 C6,6 30,2 50,2 C78,2 94,8 92,20 C94,34 68,38 50,38 C26,38 6,33 8,20 Z"/>
        </svg></span>`;
      } else if(picked === i){
        cls += " reveal-wrong";
        mark = `<span class="mark">✗</span>`;
      }
    }
    return `<button class="${cls}" data-idx="${i}" ${checked ? "disabled" : ""}>
      ${circle}<span class="tag">${optionLetter(i)}</span>${escapeHtml(opt)}${mark}
    </button>`;
  }).join("");

  const badge = checked
    ? `<span class="status-badge show ${isCorrect ? "correct" : "wrong"}">${isCorrect ? "✓ 答对了" : "✗ 再看看"}</span>`
    : `<span class="status-badge"></span>`;

  return `
  <div class="qcard" id="card-${q.id}">
    <div class="qhead">
      <span class="qnum">${escapeHtml(q.num)}</span>
      <span class="qsource">${escapeHtml(q.source)}</span>
      ${badge}
    </div>
    <div class="qstem">${stemHtml}</div>
    <div class="options">${optsHtml}</div>
    <div class="actions">
      <button class="btn" data-action="check" ${(!checked && picked===null) ? "disabled" : ""}>对答案</button>
      ${checked ? `<button class="btn ghost" data-action="retry">重新作答</button>` : ""}
    </div>
    <div class="explain ${checked ? "open" : ""}">
      <div class="explain-inner">
        <div class="explain-label"><span class="pin"></span>讲解</div>
        <div class="explain-text">${escapeHtml(q.explain)}</div>
        ${q.flag ? `<div class="flag">${escapeHtml(q.flag)}</div>` : ""}
      </div>
    </div>
  </div>`;
}

function wireCard(q){
  const card = document.getElementById(`card-${q.id}`);
  if(!card) return;

  card.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.disabled) return;
      const idx = parseInt(btn.dataset.idx,10);
      progress[q.id] = progress[q.id] || {};
      progress[q.id].picked = idx;
      progress[q.id].checked = false;
      saveProgress(progress);
      renderMain();
      renderStamps();
      requestAnimationFrame(()=>{
        document.getElementById(`card-${q.id}`)?.scrollIntoView({block:"nearest"});
      });
    });
  });

  const checkBtn = card.querySelector('[data-action="check"]');
  if(checkBtn){
    checkBtn.addEventListener("click", ()=>{
      const p = progress[q.id];
      if(!p || typeof p.picked !== "number") return;
      p.checked = true;
      saveProgress(progress);
      renderMain();
      renderStamps();
    });
  }

  const retryBtn = card.querySelector('[data-action="retry"]');
  if(retryBtn){
    retryBtn.addEventListener("click", ()=>{
      progress[q.id] = { picked: null, checked: false };
      saveProgress(progress);
      renderMain();
      renderStamps();
    });
  }
}

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderMain();
  });
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("确定要清空所有作答记录吗？这个操作无法撤销。")){
    progress = {};
    saveProgress(progress);
    renderMain();
    renderStamps();
  }
});

renderStamps();
renderMain();
</script>
</body>
</html>
